<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Factura PDF</title>
    <style>
        body { font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        #controls { margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #0056b3; }
        iframe { flex-grow: 1; border: 1px solid #ccc; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="controls">
        <h1>Prueba de Generación de PDF</h1>
        <p>Haz clic para generar el PDF usando los datos de prueba.</p>
        <button onclick="generarPDF()">Generar y Ver PDF</button>
    </div>
    <iframe id="pdfFrame" src=""></iframe>

    <script>
        async function generarPDF() {
            const payload = {
                "datosFactura": {
                    "serial": "001-001-123456",
                    "details": {
                        "nombreComercial": "Mi Empresa S.A.",
                        "ruc": "0102030405001",
                        "direccion": "Av. Siempre Viva 123",
                        "phone1": "0991234567",
                        "email": "empresa@example.com",
                        "razonSocial": "Mi Empresa S.A."
                    },
                    "customer": {
                        "email": "cliente@ejemplo.com"
                    },
                    "products": [
                        {
                            "code": "1",
                            "quantity": 2,
                            "description": "Zapatos Deportivos",
                            "unit_Price": "50.00",
                            "total": "100.00"
                        }
                    ],
                    "subtotal": "100.00",
                    "tax": "12.00",
                    "totalTax": "112.00",
                    "key": "1234567890",
                    "dateAut": "2023-10-27",
                    "ambiente": "PRUEBAS",
                    "date": "2023-10-27"
                }
            };

            try {
                const response = await fetch('http://localhost:3000/api/facturacion/ver-pdf', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    alert('Error: ' + errorText);
                    return;
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                document.getElementById('pdfFrame').src = url;

            } catch (error) {
                console.error(error);
                alert('Error de conexión: ' + error.message);
            }
        }
    </script>
</body>
</html>
